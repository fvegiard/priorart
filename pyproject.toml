[project]
name = "priorart"
version = "0.1.0"
description = "Semantically searchable knowledge base of verified fixes, served over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.7,<1",
  "httpx>=0.28",
  "mcp>=2.2,<3",
  "pydantic>=2.11",
  "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/fvegiard/priorart"
Repository = "https://github.com/fvegiard/priorart"

[project.scripts]
priorart = "priorart.cli:cli"
priorart-mcp = "priorart.server:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.4",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorart"]

[tool.hatch.build.targets.wheel.sources]
"src/priorart" = "priorart"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
